name: achievement-collector

on:
  push:
    branches: [ main ] # Tự động chạy mỗi khi có commit mới lên nhánh main
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  block_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: checkout repo content
        uses: actions/checkout@v4
        with:
          # Đưa token vào đây để cấu hình quyền Git ngay từ đầu
          token: ${{ secrets.PAT }}

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: execute py script 
        run: python main.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT }}
          commit-message: Update progress
          title: Update progress
          branch: update-progress
          delete-branch: true
